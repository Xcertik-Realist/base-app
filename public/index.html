<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Base Deploy Mini</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@farcaster/miniapp-sdk/dist/index.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, monospace; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div class="max-w-2xl mx-auto p-8">
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold mb-3">Base Deploy Mini</h1>
      <p class="text-emerald-400">I am the developer • Deploying from my wallet</p>
    </div>

    <div class="bg-gray-900 rounded-3xl p-8">
      <div class="flex justify-between items-center mb-8 p-5 bg-gray-800 rounded-2xl">
        <div id="status" class="text-gray-400">Not connected</div>
        <button onclick="connectWallet()" id="connectBtn"
                class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-2xl font-semibold transition">
          Connect My Wallet
        </button>
      </div>

      <div id="deploySection" class="hidden space-y-6">
        <div class="bg-gray-800 p-5 rounded-2xl">
          <p class="text-sm text-gray-400 mb-1">Contract</p>
          <p class="font-medium">SimpleStorage v1</p>
          <p class="text-xs text-gray-500 mono">Stores a number on-chain</p>
        </div>

        <button onclick="deployContract()" id="deployBtn"
                class="w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl font-bold text-lg transition disabled:opacity-50">
          Deploy from MY Wallet to Base
        </button>

        <div id="result" class="mt-4 text-sm"></div>
      </div>
    </div>

    <div class="text-center text-xs text-gray-500 mt-10">
      You will be the deployer • Gas paid from your wallet • Base Mainnet
    </div>
  </div>

  <script>
    let web3 = null;
    let userAddress = null;

    // ABI for:
    // contract SimpleStorage {
    //   uint256 public value;
    //   function set(uint256 _value) public { value = _value; }
    //   function get() public view returns (uint256) { return value; }
    // }
    const CONTRACT_ABI = [
      {
        "inputs": [{ "internalType": "uint256", "name": "_value", "type": "uint256" }],
        "name": "set",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "get",
        "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
        "stateMutability": "view",
        "type": "function"
      },
      {
        "inputs": [],
        "name": "value",
        "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
        "stateMutability": "view",
        "type": "function"
      }
    ];

    /**
     * REQUIRED: paste your REAL creation bytecode from Remix.
     * Remix → compile SimpleStorage → Compilation details → BYTECODE → "object"
     * Put 0x in front if missing.
     *
     * Placeholder below will NOT deploy until you replace it.
     */
    const CONTRACT_BYTECODE = "0xPASTE_YOUR_REMIX_BYTECODE_HERE";

    async function initFarcaster() {
      try {
        await new Promise((r) => setTimeout(r, 100));
        if (window.miniapp?.sdk?.actions?.ready) {
          await window.miniapp.sdk.actions.ready();
        }
      } catch (e) {
        // ignore outside Farcaster / Base mini app
      }
    }

    async function switchToBase() {
      const base = {
        chainId: "0x2105",
        chainName: "Base",
        nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
        rpcUrls: ["https://mainnet.base.org"],
        blockExplorerUrls: ["https://basescan.org"]
      };

      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: base.chainId }]
        });
      } catch (e) {
        if (e.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [base]
          });
        } else {
          throw e;
        }
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("Please install a wallet like MetaMask");
        return;
      }

      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        userAddress = accounts[0];
        web3 = new Web3(window.ethereum);

        document.getElementById("status").innerHTML =
          `✅ Connected: ${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
        document.getElementById("connectBtn").classList.add("hidden");
        document.getElementById("deploySection").classList.remove("hidden");

        await switchToBase();
      } catch (err) {
        console.error(err);
        alert("Connection failed: " + (err.message || err));
      }
    }

    async function deployContract() {
      const resultEl = document.getElementById("result");
      const btn = document.getElementById("deployBtn");

      if (!web3 || !userAddress) {
        alert("Connect your wallet first");
        return;
      }

      if (!CONTRACT_BYTECODE || CONTRACT_BYTECODE.includes("PASTE_YOUR_REMIX")) {
        resultEl.innerHTML =
          `<p class="text-red-400">❌ Set CONTRACT_BYTECODE in index.html (copy from Remix compile output).</p>`;
        return;
      }

      try {
        btn.disabled = true;
        resultEl.innerHTML = `<p class="text-yellow-400">Switching to Base & estimating gas...</p>`;

        await switchToBase();

        const contract = new web3.eth.Contract(CONTRACT_ABI);
        const deployTx = contract.deploy({ data: CONTRACT_BYTECODE });

        resultEl.innerHTML = `<p class="text-yellow-400">Confirm the deploy transaction in your wallet...</p>`;

        const gas = await deployTx.estimateGas({ from: userAddress });
        const gasLimit = Math.floor(Number(gas) * 1.2);

        const deployed = await deployTx.send({
          from: userAddress,
          gas: gasLimit
        });

        const address = deployed.options.address;

        resultEl.innerHTML = `
          <p class="text-emerald-400 font-semibold">✅ Deployed successfully</p>
          <p class="mono break-all mt-2">${address}</p>
          <a class="text-blue-400 underline text-xs inline-block mt-2" target="_blank" rel="noopener"
             href="https://basescan.org/address/${address}">
            View on Basescan
          </a>
        `;
      } catch (err) {
        console.error(err);
        const msg = err?.message || String(err);
        resultEl.innerHTML = `<p class="text-red-400">❌ Deploy failed: ${msg}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    window.addEventListener("load", async () => {
      await initFarcaster();
    });
  </script>
</body>
</html>
