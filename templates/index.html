<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Note</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <h1 class="text-4xl font-bold text-gray-800 mb-2">Quick Note 📝</h1>
    <p class="text-gray-500 mb-8">Simple. Fast. Deployed on Vercel.</p>

    <form method="POST" action="/add" class="bg-white p-6 rounded-2xl shadow-sm mb-8">
      <input type="text" name="title" placeholder="Note title (optional)" 
             class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 mb-3">
      
      <textarea name="content" rows="4" placeholder="Write your note here..." 
                class="w-full p-4 border border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500 resize-none"></textarea>
      
      <button type="submit" 
              class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-medium transition">
        Save Note
      </button>
    </form>

    <div class="space-y-4">
      {% for note in notes %}
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-semibold text-lg text-gray-800">{{ note.title }}</h3>
            <p class="text-gray-500 text-sm">{{ note.time }}</p>
          </div>
          <a href="/delete/{{ note.id }}" 
             class="text-red-500 hover:text-red-600 text-2xl leading-none">×</a>
        </div>
        <p class="mt-4 text-gray-700 whitespace-pre-wrap">{{ note.content }}</p>
      </div>
      {% endfor %}

      {% if not notes %}
      <div class="text-center py-16 text-gray-400">
        No notes yet.<br>Add one above 👆
      </div>
      {% endif %}
    </div>
  </div>
</body>
</html>
